sonar.organization=chubbyphp
sonar.projectKey=chubbyphp_chubbyphp-static-file
sonar.projectName=chubbyphp-static-file

sonar.sources=src
sonar.tests=tests
sonar.language=php
sonar.sourceEncoding=UTF-8
sonar.php.coverage.reportPaths=build/phpunit/clover.xml
sonar.php.tests.reportPath=build/phpunit/junit.xml
# generated data file, nothing to cover
sonar.coverage.exclusions=src/mimetypes.php

# src/mimetypes.php is a generated extension-to-mimetype map (see generate-mimetypes.php);
# repeated mimetype strings there are data, not duplicated code.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=src/mimetypes.php

# src/StaticFileMiddleware.php uses `require` for its return value (the mimetypes array).
# `require_once` returns `true` on repeated inclusion, which would break a second instance.
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.e2.resourceKey=src/StaticFileMiddleware.php
